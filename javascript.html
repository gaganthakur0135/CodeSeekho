
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript Tutorial | CodeSeekho</title>
<style>
:root {
  --bg:#030b20;
  --panel:#0b1730;
  --accent:#00e8c0;
  --text:#e8f0ff;
  --muted:#9aaccb;
  --border:#1b3153;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,sans-serif;line-height:1.7;
}
header{
  position:sticky;top:0;z-index:5;background:#071229;
  border-bottom:1px solid var(--border);padding:14px 22px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.logo{font-size:22px;font-weight:bold;color:var(--accent)}
header a{color:var(--text);text-decoration:none}
.layout{display:flex;min-height:calc(100vh - 65px)}
aside{
  width:265px;flex-shrink:0;background:#061127;
  border-right:1px solid var(--border);padding:18px;
  height:calc(100vh - 65px);position:sticky;top:65px;overflow:auto;
}
aside h3{color:var(--accent);margin-top:0}
aside a{
  display:block;color:var(--muted);text-decoration:none;
  padding:8px 10px;border-radius:7px;margin:3px 0;font-size:14px;
}
aside a:hover,aside a.active{background:#103044;color:var(--accent)}
main{width:100%;max-width:1050px;margin:auto;padding:28px}
h1{line-height:1.25}
h1 span,h2{color:var(--accent)}
.panel{
  background:var(--panel);border:1px solid var(--border);
  padding:22px;border-radius:14px;margin:18px 0;
}
p{color:#c8d5ec}
pre{
  white-space:pre-wrap;overflow-wrap:anywhere;background:#020817;
  border:1px solid var(--border);padding:15px;border-radius:9px;
  color:#b8ffe9;overflow-x:auto;
}
button{
  border:0;border-radius:8px;padding:11px 17px;
  font-weight:bold;cursor:pointer;background:var(--accent);color:#041320;
}
button:disabled{opacity:.35;cursor:not-allowed}
.controls{display:flex;justify-content:space-between;gap:12px;margin:20px 0}
.secondary{background:#19314e;color:white}
.progress{height:7px;background:#192943;border-radius:20px;overflow:hidden}
#progressFill{height:100%;width:0;background:var(--accent);transition:width .2s}
textarea{
  width:100%;min-height:220px;background:#020817;color:#c8ffe9;
  border:1px solid #294767;border-radius:9px;padding:14px;
  font:14px/1.6 Consolas,monospace;resize:vertical;
}
#output{min-height:65px;color:#c8ffe9}
.small{font-size:13px;color:var(--muted)}
.home-link{display:inline-block;color:var(--accent);text-decoration:none;font-weight:bold}
.home-link:hover{text-decoration:underline}
@media(max-width:760px){
 .layout{display:block}
 aside{width:100%;height:auto;position:relative;top:0;
   max-height:240px;border-right:0;border-bottom:1px solid var(--border)}
 main{padding:16px}
 header{padding:12px}
}
</style>
</head>
<body>
<header>
  <div class="logo">CodeSeekho</div>
  <a href="index.html">Home</a>
</header>

<div class="layout">
<aside>
  <h3>JavaScript Tutorial</h3>
  <div id="lessonList"></div>
</aside>

<main>
  <p><a class="home-link" href="index.html">← Back to Home</a></p>
  <h1>Learn <span>JavaScript</span></h1>
  <p>Learn JavaScript step by step with beginner-friendly explanations, examples, and practice.</p>

  <div class="panel">
    <div class="progress"><div id="progressFill"></div></div>
    <p id="lessonProgress">Lesson 1</p>
    <div id="lessonContent"></div>
  </div>

  <div class="panel">
    <h2>Try JavaScript Yourself</h2>
    <p>Write and run JavaScript code directly on CodeSeekho.</p>

    <iframe
      src="https://onecompiler.org/embed/javascript"
      width="100%"
      height="500"
      frameborder="0"
      allowfullscreen
      style="border:1px solid var(--accent); border-radius:12px; background:white;">
    </iframe>
  </div>

  <div class="controls">
    <button class="secondary" id="prevBtn" onclick="showLesson(currentLesson-1)">← Previous</button>
    <button id="nextBtn" onclick="showLesson(currentLesson+1)">Next →</button>
  </div>
</main>
</div>

<script>
const lessons = [
{
title:"Introduction to JavaScript",
desc:"JavaScript is a programming language used to make websites interactive. It can respond to button clicks, validate forms, update page content, and work with data. It runs directly in modern web browsers.",
code:'console.log("Hello, JavaScript!");',
out:"Hello, JavaScript!",
tip:"HTML builds the page structure, CSS styles it, and JavaScript adds behaviour."
},
{
title:"Adding JavaScript to HTML",
desc:"JavaScript can be written inside a script element in an HTML file or placed in a separate .js file. An external file can be connected with a script element and a src attribute.",
code:'<script src="script.js"><'+'/script>',
out:"The browser loads and runs script.js.",
tip:"Keep the JavaScript file name and path correct."
},
{
title:"Output with console.log",
desc:"console.log() prints information in the browser developer console. It is useful for checking values and debugging your program.",
code:'console.log("Welcome!");\nconsole.log(5 + 3);',
out:"Welcome!\n8",
tip:"Open your browser developer tools to view console output."
},
{
title:"Variables: let and const",
desc:"Variables store values. Use let when a variable needs reassignment, and const when the variable should not be reassigned. Declare variables with meaningful names.",
code:'let age = 18;\nconst country = "India";\nconsole.log(age);\nconsole.log(country);',
out:"18\nIndia",
tip:"A const object can still have its properties changed; const prevents reassignment of the binding."
},
{
title:"Old var Keyword",
desc:"var is an older way to declare variables. It is function-scoped and behaves differently from let and const. For modern code, let and const are generally easier to reason about.",
code:'var city = "Agra";\nconsole.log(city);',
out:"Agra",
tip:"Prefer let and const for most new JavaScript code."
},
{
title:"Data Types",
desc:"JavaScript has primitive data types including string, number, bigint, boolean, undefined, null, and symbol. Objects, including arrays and functions, are reference types.",
code:'let name = "Riya";\nlet age = 20;\nlet passed = true;\nconsole.log(typeof name);\nconsole.log(typeof age);\nconsole.log(typeof passed);',
out:"string\nnumber\nboolean",
tip:"typeof null returns 'object' for historical reasons."
},
{
title:"Strings",
desc:"A string stores text. Strings can use single quotes, double quotes, or backticks. Backticks also support template literals, which can insert expressions into text.",
code:'let name = "Aman";\nconsole.log("Hello " + name);\nconsole.log(`Welcome, ${name}!`);',
out:"Hello Aman\nWelcome, Aman!",
tip:"Use template literals when combining text with values."
},
{
title:"Numbers and Math",
desc:"JavaScript uses the Number type for most everyday numeric values. Arithmetic operators include addition, subtraction, multiplication, division, and remainder.",
code:'console.log(10 + 3);\nconsole.log(10 - 3);\nconsole.log(10 * 3);\nconsole.log(10 / 2);\nconsole.log(10 % 3);',
out:"13\n7\n30\n5\n1",
tip:"Use Number.isNaN() when you need to test whether a value is NaN."
},
{
title:"Booleans",
desc:"A boolean has one of two values: true or false. Booleans commonly represent whether a condition is satisfied.",
code:'let isStudent = true;\nconsole.log(isStudent);\nconsole.log(5 > 2);',
out:"true\ntrue",
tip:"Boolean values are not the same as the strings 'true' and 'false'."
},
{
title:"Type Conversion",
desc:"Type conversion changes a value from one type to another. Number(), String(), and Boolean() are useful conversion functions. Be aware that not every text value can become a valid number.",
code:'console.log(Number("25"));\nconsole.log(String(100));\nconsole.log(Boolean(1));',
out:"25\n100\ntrue",
tip:"Number('hello') produces NaN because the text is not a valid number."
},
{
title:"Operators",
desc:"Operators perform actions on values. JavaScript includes arithmetic, assignment, comparison, logical, and other operators.",
code:'let total = 10;\ntotal += 5;\nconsole.log(total);\nconsole.log(5 === "5");',
out:"15\nfalse",
tip:"Prefer strict equality === over loose equality == in most cases."
},
{
title:"Comparison Operators",
desc:"Comparison operators compare values and return a boolean. Examples include ===, !==, >, <, >=, and <=.",
code:'console.log(8 > 5);\nconsole.log(4 === 4);\nconsole.log(4 !== 5);',
out:"true\ntrue\ntrue",
tip:"Strict equality checks value and type without automatic coercion."
},
{
title:"If Statement",
desc:"An if statement runs code only when its condition is true.",
code:'let age = 20;\nif (age >= 18) {\n  console.log("Adult");\n}',
out:"Adult",
tip:"Conditions should evaluate to true or false."
},
{
title:"If-Else Statement",
desc:"An if-else statement selects between two paths. The if block runs when the condition is true; otherwise the else block runs.",
code:'let number = 7;\nif (number % 2 === 0) {\n  console.log("Even");\n} else {\n  console.log("Odd");\n}',
out:"Odd",
tip:"The remainder operator % can help test even and odd numbers."
},
{
title:"Else-If Ladder",
desc:"An else-if ladder checks multiple conditions in order. The first true branch runs and the remaining branches are skipped.",
code:'let marks = 76;\nif (marks >= 80) console.log("A");\nelse if (marks >= 60) console.log("B");\nelse console.log("Keep practising");',
out:"B",
tip:"Test boundary values to make sure the conditions are correct."
},
{
title:"Switch Statement",
desc:"A switch statement selects a matching case. Use break to exit the switch when a case is complete.",
code:'let day = 2;\nswitch (day) {\n  case 1: console.log("Monday"); break;\n  case 2: console.log("Tuesday"); break;\n  default: console.log("Unknown");\n}',
out:"Tuesday",
tip:"A default case handles values that do not match any listed case."
},
{
title:"For Loop",
desc:"A for loop repeats a block of code. Its initialization, condition, and update are written in the loop header.",
code:'for (let i = 1; i <= 5; i++) {\n  console.log(i);\n}',
out:"1\n2\n3\n4\n5",
tip:"Check the condition and update to avoid infinite loops."
},
{
title:"While Loop",
desc:"A while loop repeats while its condition remains true. The condition is checked before each iteration.",
code:'let i = 1;\nwhile (i <= 3) {\n  console.log(i);\n  i++;\n}',
out:"1\n2\n3",
tip:"Make sure the loop eventually changes the condition to false."
},
{
title:"Do-While Loop",
desc:"A do-while loop runs its body at least once because the condition is checked after the body.",
code:'let i = 1;\ndo {\n  console.log(i);\n  i++;\n} while (i <= 3);',
out:"1\n2\n3",
tip:"Remember the semicolon after the while condition."
},
{
title:"Break and Continue",
desc:"break exits a loop, while continue skips the remainder of the current iteration and moves to the next one.",
code:'for (let i = 1; i <= 5; i++) {\n  if (i === 3) continue;\n  console.log(i);\n}',
out:"1\n2\n4\n5",
tip:"Use loop-control statements when they make the logic clearer."
},
{
title:"Functions",
desc:"A function is a reusable block of code that performs a task. You can define a function once and call it whenever needed.",
code:'function greet() {\n  console.log("Hello!");\n}\ngreet();',
out:"Hello!",
tip:"Use function names that describe the action they perform."
},
{
title:"Function Parameters",
desc:"Parameters allow functions to receive input. The values passed when calling a function are called arguments.",
code:'function greet(name) {\n  console.log("Hello " + name);\n}\ngreet("Asha");',
out:"Hello Asha",
tip:"A function can accept more than one parameter."
},
{
title:"Return Values",
desc:"The return statement sends a result back to the caller and ends the current function execution.",
code:'function add(a, b) {\n  return a + b;\n}\nconsole.log(add(4, 6));',
out:"10",
tip:"Use return when a function should produce a value for other code."
},
{
title:"Arrow Functions",
desc:"Arrow functions provide a concise syntax for writing functions. They are common in callbacks and modern JavaScript.",
code:'const multiply = (a, b) => a * b;\nconsole.log(multiply(3, 4));',
out:"12",
tip:"Arrow functions do not have their own this value."
},
{
title:"Scope",
desc:"Scope determines where a variable can be accessed. Variables declared with let and const are block-scoped, while var is function-scoped.",
code:'let message = "Hello";\nif (true) {\n  let word = "JavaScript";\n  console.log(word);\n}\nconsole.log(message);',
out:"JavaScript\nHello",
tip:"A variable declared inside a block with let cannot be used outside that block."
},
{
title:"Arrays",
desc:"An array stores an ordered collection of values. Array indexes begin at zero, and the length property reports how many elements are present.",
code:'const fruits = ["Apple", "Mango", "Banana"];\nconsole.log(fruits[0]);\nconsole.log(fruits.length);',
out:"Apple\n3",
tip:"The final valid index is array.length - 1."
},
{
title:"Array Methods",
desc:"Arrays provide methods such as push, pop, includes, and join. These methods can add, remove, search, or combine array elements.",
code:'const numbers = [2, 4];\nnumbers.push(6);\nconsole.log(numbers.join(", "));\nconsole.log(numbers.includes(4));',
out:"2, 4, 6\ntrue",
tip:"Some array methods modify the original array while others return a new array."
},
{
title:"for...of Loop",
desc:"The for...of loop iterates over values in iterable objects such as arrays and strings.",
code:'const colors = ["Red", "Blue"];\nfor (const color of colors) {\n  console.log(color);\n}',
out:"Red\nBlue",
tip:"Use for...of when you want values rather than array indexes."
},
{
title:"Objects",
desc:"Objects store data as key-value pairs. Properties can represent information, and methods can represent behaviour.",
code:'const student = {\n  name: "Ravi",\n  age: 19\n};\nconsole.log(student.name);',
out:"Ravi",
tip:"Use descriptive property names to make objects easier to understand."
},
{
title:"Object Methods",
desc:"A method is a function stored as an object property. Methods can use the object's data to perform an action.",
code:'const user = {\n  name: "Mina",\n  greet() {\n    return "Hi " + this.name;\n  }\n};\nconsole.log(user.greet());',
out:"Hi Mina",
tip:"The meaning of this depends on how a function is called."
},
{
title:"Destructuring",
desc:"Destructuring extracts values from arrays or properties from objects into variables using a compact syntax.",
code:'const [a, b] = [10, 20];\nconst {name} = {name: "Asha"};\nconsole.log(a, b, name);',
out:"10 20 Asha",
tip:"Destructuring can make code shorter when accessing several related values."
},
{
title:"Spread Syntax",
desc:"Spread syntax (...) expands iterable values or object properties. It is commonly used to copy arrays, combine values, and create updated objects.",
code:'const first = [1, 2];\nconst second = [...first, 3];\nconsole.log(second.join(", "));',
out:"1, 2, 3",
tip:"Spread creates a shallow copy, not a deep clone of nested objects."
},
{
title:"Template Literals",
desc:"Template literals use backticks and allow expressions to be inserted with ${...}. They also make multiline strings easier to write.",
code:'const name = "Riya";\nconst score = 90;\nconsole.log(`${name} scored ${score}`);',
out:"Riya scored 90",
tip:"The expression inside ${...} is evaluated."
},
{
title:"JSON",
desc:"JSON is a text format for exchanging structured data. JSON.stringify converts supported JavaScript data to JSON text, and JSON.parse converts valid JSON text back to a value.",
code:'const user = {name: "Aman", age: 20};\nconst text = JSON.stringify(user);\nconsole.log(text);\nconsole.log(JSON.parse(text).name);',
out:'{"name":"Aman","age":20}\nAman',
tip:"JSON does not support functions or undefined values as ordinary JSON data."
},
{
title:"The DOM",
desc:"The Document Object Model (DOM) represents an HTML page as objects. JavaScript can use the DOM to read and update page content and attributes.",
code:'document.body.textContent = "Page updated by JavaScript";',
out:"The webpage text changes when this code runs in a real page.",
tip:"This tutorial editor runs code in a sandbox, so document changes are isolated from this tutorial page."
},
{
title:"Selecting HTML Elements",
desc:"Methods such as getElementById and querySelector find elements in a document. The returned element can then be inspected or updated.",
code:'const title = document.querySelector("h1");\nconsole.log(title.textContent);',
out:"The selected heading text appears when run in a webpage with an h1 element.",
tip:"A selector returns null if no matching element exists."
},
{
title:"Changing HTML Content",
desc:"JavaScript can change an element's text with textContent. For user-provided text, textContent is usually safer than inserting it as HTML.",
code:'const box = document.createElement("p");\nbox.textContent = "Hello from JavaScript";\nconsole.log(box.textContent);',
out:"Hello from JavaScript",
tip:"Avoid putting untrusted user input into innerHTML."
},
{
title:"Events",
desc:"Events happen when users or the browser do something, such as clicking a button or submitting a form. Event listeners run a function in response to an event.",
code:'console.log("Event listeners use addEventListener() on an element.");',
out:"Event listeners use addEventListener() on an element.",
tip:"Use addEventListener instead of assigning many different handlers to the same event property."
},
{
title:"Form Validation",
desc:"JavaScript can check form values before submitting them. Client-side validation improves the user experience, but important checks must also be done on the server.",
code:'const email = "student@example.com";\nconsole.log(email.includes("@"));',
out:"true",
tip:"A simple @ check is only a basic example, not complete email validation."
},
{
title:"Timers",
desc:"setTimeout runs a callback after a delay, while setInterval repeats a callback at an interval. Timers are asynchronous and do not guarantee exact timing.",
code:'setTimeout(() => {\n  console.log("This appears after a short delay");\n}, 100);',
out:"This appears after a short delay",
tip:"Clear timers when they are no longer needed."
},
{
title:"Error Handling",
desc:"try and catch allow a program to handle errors. The finally block can run cleanup code whether an error happened or not.",
code:'try {\n  JSON.parse("{bad json}");\n} catch (error) {\n  console.log("Invalid JSON");\n}',
out:"Invalid JSON",
tip:"Handle errors you can meaningfully recover from."
},
{
title:"Classes",
desc:"Classes provide syntax for creating objects with shared structure and behaviour. A constructor can initialize fields, and methods define actions.",
code:'class Student {\n  constructor(name) { this.name = name; }\n  greet() { return "Hi " + this.name; }\n}\nconsole.log(new Student("Ravi").greet());',
out:"Hi Ravi",
tip:"JavaScript classes use prototype-based inheritance under the hood."
},
{
title:"Inheritance",
desc:"A class can extend another class and reuse its methods. The super keyword can call the parent constructor or parent methods.",
code:'class Animal { speak() { return "Sound"; } }\nclass Dog extends Animal { speak() { return "Woof"; } }\nconsole.log(new Dog().speak());',
out:"Woof",
tip:"Use inheritance for a meaningful is-a relationship."
},
{
title:"Map and Set",
desc:"Map stores key-value pairs and allows keys of different types. Set stores unique values. They are useful alternatives to ordinary objects and arrays in suitable situations.",
code:'const values = new Set([1, 2, 2, 3]);\nconsole.log(values.size);\nconst map = new Map();\nmap.set("name", "Asha");\nconsole.log(map.get("name"));',
out:"3\nAsha",
tip:"A Set automatically keeps only one copy of each value."
},
{
title:"Callbacks",
desc:"A callback is a function passed to another function so it can be called later. Callbacks are common in events, timers, and array methods.",
code:'function greet(name, callback) {\n  callback("Hello " + name);\n}\ngreet("Aman", message => console.log(message));',
out:"Hello Aman",
tip:"Keep deeply nested callbacks under control by splitting work into named functions."
},
{
title:"Promises",
desc:"A Promise represents the eventual success or failure of an asynchronous operation. It can be pending, fulfilled, or rejected. then and catch handle the result.",
code:'Promise.resolve("Done")\n  .then(value => console.log(value))\n  .catch(error => console.log("Error"));',
out:"Done",
tip:"A promise represents a future result, not the result itself."
},
{
title:"Async and Await",
desc:"async functions return promises. await pauses that function until a promise settles, making asynchronous code easier to read.",
code:'async function getMessage() {\n  return "Hello async";\n}\ngetMessage().then(console.log);',
out:"Hello async",
tip:"Use try and catch inside async functions when you need to handle rejected promises."
},
{
title:"Fetch API",
desc:"The Fetch API makes HTTP requests and returns a Promise. A response should be checked for HTTP errors, and JSON response bodies can be read with response.json().",
code:'console.log("fetch(url) returns a Promise for an HTTP response.");',
out:"fetch(url) returns a Promise for an HTTP response.",
tip:"This editor blocks network access, so make network requests in a proper development environment."
},
{
title:"Modules",
desc:"JavaScript modules let code be split into separate files. export makes values available to other modules, and import brings them into a module that uses them.",
code:'// In math.js:\nexport const add = (a, b) => a + b;\n\n// In another module:\n// import { add } from "./math.js";',
out:"Module code is loaded by a JavaScript module environment.",
tip:"Modules are commonly served over HTTP during development rather than opened as local files."
},
{
title:"Local Storage",
desc:"localStorage can save string values in a browser between sessions. It is useful for simple preferences, but it should not be used to store passwords or sensitive information.",
code:'console.log("localStorage stores strings in a browser.");',
out:"localStorage stores strings in a browser.",
tip:"This sandboxed editor does not expose the tutorial page's local storage."
},
{
title:"Debugging",
desc:"Debugging means finding and fixing problems in a program. Use console messages, browser developer tools, breakpoints, and small test cases to understand what the code is doing.",
code:'const total = 5 + 7;\nconsole.log("total =", total);',
out:"total = 12",
tip:"Read the error message and line information before changing code."
},
{
title:"Strict Mode",
desc:"Strict mode catches some mistakes and changes certain JavaScript behaviours. It can be enabled with the directive 'use strict'; modules and class bodies are strict by default.",
code:'"use strict";\nlet count = 1;\nconsole.log(count);',
out:"1",
tip:"Strict mode helps catch errors but does not replace testing."
},
{
title:"Optional Chaining",
desc:"Optional chaining (?.) safely accesses a property or method when the value before it is null or undefined. It returns undefined instead of throwing for that missing part of the chain.",
code:'const user = {};\nconsole.log(user.address?.city);',
out:"undefined",
tip:"Optional chaining does not make every later operation safe."
},
{
title:"Nullish Coalescing",
desc:"The nullish coalescing operator (??) uses a fallback only when the left value is null or undefined. Unlike ||, it preserves values such as 0 and an empty string.",
code:'const score = 0;\nconsole.log(score ?? 100);',
out:"0",
tip:"Choose ?? when zero or an empty string is a valid value."
},
{
title:"Array map and filter",
desc:"map creates a new array by transforming each element. filter creates a new array containing only elements that pass a condition.",
code:'const numbers = [1, 2, 3, 4];\nconsole.log(numbers.map(n => n * 2).join(", "));\nconsole.log(numbers.filter(n => n > 2).join(", "));',
out:"2, 4, 6, 8\n3, 4",
tip:"These methods return new arrays and do not directly replace the original array."
},
{
title:"Final Practice Project",
desc:"Build a small interactive task list to practise arrays, objects, functions, and DOM events. Add a text input, an Add button, and a list that displays tasks. Later, add delete and completion features.",
code:'const tasks = ["Learn variables", "Practise functions"];\ntasks.push("Build a project");\nconsole.log(tasks.join("\\n"));',
out:"Learn variables\nPractise functions\nBuild a project",
tip:"Start with one working feature, test it, and then add the next feature."
}
];

let currentLesson = 0;

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[char]);
}

function renderLessons() {
  const list = document.getElementById("lessonList");
  list.innerHTML = "";
  lessons.forEach((lesson, index) => {
    const link = document.createElement("a");
    link.href = "#lesson-" + (index + 1);
    link.textContent = (index + 1) + ". " + lesson.title;
    link.addEventListener("click", event => {
      event.preventDefault();
      showLesson(index);
    });
    list.appendChild(link);
  });
}

function showLesson(index) {
  currentLesson = Math.max(0, Math.min(index, lessons.length - 1));
  const lesson = lessons[currentLesson];

  document.getElementById("lessonContent").innerHTML = `
    <h2>${currentLesson + 1}. ${escapeHTML(lesson.title)}</h2>
    <p>${escapeHTML(lesson.desc)}</p>
    <h3>Example</h3>
    <pre><code>${escapeHTML(lesson.code)}</code></pre>
    <h3>Expected output / result</h3>
    <pre><code>${escapeHTML(lesson.out)}</code></pre>
    <p><strong>Remember:</strong> ${escapeHTML(lesson.tip)}</p>
  `;

  document.getElementById("lessonProgress").textContent =
    `Lesson ${currentLesson + 1} of ${lessons.length}`;
  document.getElementById("progressFill").style.width =
    ((currentLesson + 1) / lessons.length * 100) + "%";

  [...document.querySelectorAll("#lessonList a")].forEach((link, i) => {
    link.classList.toggle("active", i === currentLesson);
  });

  document.getElementById("prevBtn").disabled = currentLesson === 0;
  document.getElementById("nextBtn").disabled = currentLesson === lessons.length - 1;
  window.scrollTo({top: 0, behavior: "smooth"});
}
